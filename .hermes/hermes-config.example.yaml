# 示例，不是 Hermes 全局配置。复制到自己的 profile 后按实际版本映射字段。
# API key 只放 profile 的 .env 或系统密钥存储，不能提交到仓库。
terminal:
  backend: local
  cwd: "F:/SteamLibrary/steamapps/common/Darkwood/Darkwood Multiplayer framework"
model:
  provider: "<your-provider>"
  default: "<provider>/<ds-v4-pro-model-id>"
  fast: "<provider>/<fast-review-model-id>"
approval:
  overwrite_runtime_files: manual
  start_game: manual
  package_release: manual
context:
  project_files:
    - AGENTS.md
    - .hermes.md
    - .hermes/project.yaml
    - .hermes/context/current-status.md
