  - 拒绝、超时、断线后双方容器/玩家库存一致且无 cursor item
verification:
  - 构建 solution，要求 0 warning / 0 error
  - 运行全部 SelfTests
  - 双端真实 Darkwood 测试拿取/放置/拖放/堆叠/交换/并发/重连矩阵
evidence_required:
  - 修改文件与行号
  - 编译和 SelfTests 命令、退出码
  - Host/Client 日志与 DLL SHA256
  - 未验证项和回滚方法
risk: high
rollback: 保留 0.8.7-alpha.9 DLL、安装包、ZIP 和 manifest；未完成实机测试时状态只能是 implemented_unverified。
