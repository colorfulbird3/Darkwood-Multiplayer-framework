schema_version: 1
id: PROTO-001
title: 对齐 alpha.11 握手版本契约（单一门槛、无向下兼容）
priority: P0
status: implemented_unverified
tags: [protocol, handshake, schema, selftests]
depends_on: []
owner_role: architect
scope: >-
  以“无向下兼容”策略解决握手与内部 SaveBundle/WorldSnapshot wire 版本漂移：
  握手身份简化为 FrameworkVersion + GameVersion 单一门槛，内部 codec 版本头成为
  实现细节随框架版本绑定；SelfTests 使用当前身份常量与版本不一致拒绝负例。
out_of_scope:
  - 不替换 Telepathy
  - 不修改 Darkwood 游戏玩法
  - 不保留旧版本兼容/翻译路径
files:
  - src/DarkwoodMultiplayerFramework.Protocol/HandshakeProtocol.cs
  - src/DarkwoodMultiplayerFramework.Protocol/ReplicationProtocol.cs
  - src/DarkwoodMultiplayerFramework.Network/HandshakeSessions.cs
  - src/DarkwoodMultiplayerFramework.DarkwoodAdapter/DarkwoodAdapterRuntime.cs
  - src/DarkwoodMultiplayerFramework.DarkwoodAdapter/Plugin.cs
  - src/DarkwoodMultiplayerFramework.SelfTests/Program.cs
invariants:
  - wire_version_is_explicit
  - incompatible_schema_is_rejected
  - selftests_cover_current_release_identity
acceptance:
  - 决定并记录：无向下兼容，FrameworkVersion 为唯一版本门槛（已记录于 protocol-contract.md）
  - 握手只比较 FrameworkVersion + GameVersion；SaveSchema/SnapshotSchema 字段删除
  - 运行时身份与 codec 使用单一可追踪常量 ProtocolVersions（EnvelopeProtocol + Framework）
  - SelfTests 覆盖当前 alpha.11 roundtrip、截断、未知枚举、框架/游戏构建不一致拒绝测试
verification:
  - dotnet build 0 warning / 0 error
  - SelfTests 全部通过且输出包含 alpha.11 identity
  - 双端真实 Darkwood 测试（不同版本互连必须被拒绝）
risk: high
rollback: 保留 alpha.10 与 alpha.11 的 DLL、安装包、ZIP 和 manifest；未完成双端实机前状态只能是 implemented_unverified。
