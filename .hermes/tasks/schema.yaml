schema_version: 1
required: [id, title, priority, status, tags, scope, files, invariants, acceptance, verification, risk, rollback]
fields:
  id: string
  title: string
  priority: { enum: [P0, P1, P2, P3] }
  status: { enum: [planned, in_progress, blocked, implemented_unverified, verified, done] }
  tags: { type: array }
  depends_on: { type: array, default: [] }
  scope: string
  out_of_scope: { type: array }
  files: { type: array }
  context: { type: array }
  invariants: { type: array }
  acceptance: { type: array }
  verification: { type: array }
  evidence_required: { type: array }
  risk: { enum: [low, medium, high, critical] }
  rollback: string
  owner_role: { enum: [architect, implementer, reviewer, test_release] }
  blocked_reason: string
  result: { type: object }
