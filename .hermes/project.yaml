schema: 1
project:
  id: darkwood-multiplayer-framework
  display_name: Darkwood Multiplayer Framework
  language: zh-CN
  canonical_root: "F:/SteamLibrary/steamapps/common/Darkwood/Darkwood Multiplayer framework"
  source_root: "src"
  baseline:
    release: "0.8.7-alpha.11"
    envelope_protocol: 3
    version_gate: "framework_version_only_no_backward_compat"
  runtime:
    game: Darkwood
    loader: BepInEx 5.4.23.5
    patching: Harmony 2.9.0.0
    transport: Telepathy TCP 1.0.341.0
    adapter_target: net472
    core_targets: [netstandard2.0, netstandard2.1]
    selftests_target: net7.0
  hermes_role: development-agent
  ds_v4_role: development-model
  runtime_sdk_status: not-provided

paths:
  source: "src"
  runtime_plugins: "F:/SteamLibrary/steamapps/common/Darkwood/BepInEx/plugins"
  payload: "Payload"
  release_directory: "F:/SteamLibrary/steamapps/common/Darkwood/Darkwood联机框架-安装包-v0.8.7-alpha.11"
  release_zip: "F:/SteamLibrary/steamapps/common/Darkwood/Darkwood联机框架-安装包-v0.8.7-alpha.11.zip"
  build_staging: "F:/Private Blog/DMF Local Build/bin"

commands:
  build: "dotnet build ./src/DarkwoodMultiplayerFramework.sln -c Release --no-restore -m:1 -p:MSBuildEnableWorkloadResolver=false"
  selftests: "dotnet run --project ./src/DarkwoodMultiplayerFramework.SelfTests/DarkwoodMultiplayerFramework.SelfTests.csproj -c Release --no-build -p:MSBuildEnableWorkloadResolver=false"
  hash_plugins: "Get-ChildItem ./Payload/BepInEx/plugins -Filter '*.dll' | Get-FileHash -Algorithm SHA256"

workflow:
  default_branch: main
  source_of_truth: local-canonical-tree
  require_clean_baseline_before_release: true
  require_user_confirmation_for:
    - overwrite_runtime_dlls
    - start_game
    - create_zip_or_release
    - push_to_github

context:
  always:
    - AGENTS.md
    - .hermes.md
    - .hermes/project.yaml
    - .hermes/context/current-status.md
  route_by_tag:
    protocol:
      - .hermes/context/protocol-contract.md
      - src/DarkwoodMultiplayerFramework.Protocol
      - src/DarkwoodMultiplayerFramework.Network
    inventory:
      - .hermes/context/inventory-authority.md
      - src/DarkwoodMultiplayerFramework.Inventory
      - src/DarkwoodMultiplayerFramework.DarkwoodAdapter/DarkwoodContainerTakePatch.cs
      - src/DarkwoodMultiplayerFramework.DarkwoodAdapter/DarkwoodPlayerInventoryShadow.cs
    entity:
      - .hermes/context/entity-snapshot.md
      - src/DarkwoodMultiplayerFramework.Entities
      - src/DarkwoodMultiplayerFramework.Snapshots
    adapter:
      - .hermes/context/darkwood-adapter.md
      - src/DarkwoodMultiplayerFramework.DarkwoodAdapter
    release:
      - .hermes/context/build-release.md
      - src/DarkwoodMultiplayerFramework.SelfTests
  exclude_by_default:
    - Payload
    - legacy-reference
    - legacy-reference-first-pass
    - .tools
    - "**/bin"
    - "**/obj"
    - "*.dll"
    - "*.zip"
    - Darkwood_Data

invariants:
  authority: host
  action_key: SessionId+PeerId+RequestId
  revision_policy: compare_and_swap
  ready_requires: [save_verified, registry_bound, snapshot_applied, shared_containers_bound]
  persistent_id_forbidden: [GetInstanceID, name, instantiate_order]

validation_gates:
  - id: G0-baseline
    name: canonical source and release manifest
  - id: G1-protocol
    name: envelope handshake schema and negative tests
  - id: G2-transport
    name: Telepathy contract and reconnect tests
  - id: G3-snapshot
    name: registry and world snapshot completeness
  - id: G4-inventory
    name: host-authoritative inventory transaction
  - id: G5-runtime
    name: real two-end Darkwood test
  - id: G6-release
    name: build hashes license and package audit
  - id: G7-provider-adapter
    name: only after real Hermes/DS V4 SDK is supplied
